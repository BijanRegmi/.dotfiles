
[cursor]
vi_mode_style = "Block"

[terminal.shell]
program = "/bin/bash"

[cursor.style]
shape = "Beam"

[env]
TERM = "xterm-256color"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = -1

[window]
opacity = 0.9
decorations = "none"
option_as_alt = "OnlyLeft"

[window.padding]
x = 3
y = 0

[general]
import = [
    "~/.config/alacritty/catppuccin-mocha.toml"
]
